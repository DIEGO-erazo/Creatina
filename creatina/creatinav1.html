<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creatina Diaria - NFC Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1rem; }
    
    .container { background: var(--card-bg); width: 100%; max-width: 480px; padding: 1.5rem; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); text-align: center; }
    h1 { font-size: 1.5rem; margin-bottom: 0.2rem; }
    .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.2rem; }
    
    .user-badge { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; font-size: 0.9rem; color: var(--text-muted); }
    .user-badge img { width: 28px; height: 28px; border-radius: 50%; }

    .status-card { padding: 1rem; border-radius: 0.75rem; font-weight: 600; margin-bottom: 1.2rem; transition: all 0.3s ease; }
    .status-card.pending { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .status-card.completed { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }

    .btn { width: 100%; padding: 0.8rem; border: none; border-radius: 0.5rem; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; background: var(--accent); color: white; margin-bottom: 0.6rem; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); color: var(--text); }

    /* Dashboard Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin: 1.2rem 0; }
    .stat-box { background: rgba(255,255,255,0.03); padding: 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.05); }
    .stat-number { font-size: 1.2rem; font-weight: bold; color: var(--text); }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }

    /* Calendar UI */
    .calendar-container { margin-top: 1.2rem; background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 0.75rem; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .calendar-header button { background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; padding: 0 0.5rem; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.3rem; text-align: center; }
    .day-name { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; padding-bottom: 0.3rem; }
    .day-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; border-radius: 0.3rem; background: rgba(255,255,255,0.02); }
    .day-cell.taken { background: var(--success); color: #042f2e; font-weight: bold; }
    .day-cell.missed { background: var(--danger); color: white; opacity: 0.8; }
    .day-cell.empty { background: transparent; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Creatina Diaria 🧪</h1>
    <p class="subtitle" id="current-date">Cargando fecha...</p>

    <!-- Login View -->
    <div id="login-section">
      <p style="margin-bottom: 1.5rem; color: var(--text-muted);">Inicia sesión para gestionar tus dosis e historial.</p>
      <button class="btn" id="login-btn">Iniciar Sesión con Google</button>
    </div>

    <!-- App View -->
    <div id="app-section" class="hidden">
      <div class="user-badge">
        <img id="user-avatar" src="" alt="Avatar">
        <span id="user-name"></span>
      </div>

      <div id="status-card" class="status-card pending">
        Cargando estado...
      </div>

      <button class="btn" id="toggle-btn">Registrar Creatina Hoy</button>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-number" id="stat-first-date">--/--</div>
          <div class="stat-label">Primera toma</div>
        </div>
        <div class="stat-box">
          <div class="stat-number" id="stat-streak">0 🔥</div>
          <div class="stat-label">Racha actual</div>
        </div>
        <div class="stat-box">
          <div class="stat-number" id="stat-taken" style="color: var(--success)">0</div>
          <div class="stat-label">Días tomados</div>
        </div>
        <div class="stat-box">
          <div class="stat-number" id="stat-missed" style="color: var(--danger)">0</div>
          <div class="stat-label">Días no tomados</div>
        </div>
      </div>

      <!-- Calendar -->
      <div class="calendar-container">
        <div class="calendar-header">
          <button id="prev-month">&lt;</button>
          <span id="calendar-month-year" style="font-weight: 600; font-size: 0.9rem;"></span>
          <button id="next-month">&gt;</button>
        </div>
        <div class="calendar-grid" id="calendar-days">
          <!-- Calendar populated by JS -->
        </div>
      </div>

      <button class="btn btn-secondary" id="logout-btn" style="margin-top: 1.2rem;">Cerrar sesión</button>
    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Reutilizando la inicialización original
    const app = initializeApp();
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let userLogs = new Set();
    let currentDisplayDate = new Date();

    // DOM Elements
    const loginSection = document.getElementById('login-section');
    const appSection = document.getElementById('app-section');
    const statusCard = document.getElementById('status-card');
    const toggleBtn = document.getElementById('toggle-btn');

    // Display Current Date
    document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    // Format Date Helper YYYY-MM-DD
    const formatDateKey = (d) => d.toISOString().split('T')[0];

    // Auth Listeners
    document.getElementById('login-btn').onclick = () => {
      signInWithPopup(auth, provider).catch(err => console.error(err));
    };
    document.getElementById('logout-btn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('user-avatar').src = user.photoURL || '';
        document.getElementById('user-name').innerText = user.displayName;
        loginSection.classList.add('hidden');
        appSection.classList.remove('hidden');

        await loadUserLogs();
        checkAutoLog();
      } else {
        currentUser = null;
        loginSection.classList.remove('hidden');
        appSection.classList.add('hidden');
      }
    });

    // Auto Log URL query handling (?auto=true)
    async function checkAutoLog() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('auto') === 'true') {
        const todayKey = formatDateKey(new Date());
        if (!userLogs.has(todayKey)) {
          await toggleCreatineLog(todayKey, true);
        }
      }
    }

    // Firestore Sync
    async function loadUserLogs() {
      if (!currentUser) return;
      try {
        const docRef = doc(db, "creatine_users", currentUser.uid);
        const docSnap = await getDoc(docRef);

        userLogs.clear();
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.logs) {
            data.logs.forEach(dateStr => userLogs.add(dateStr));
          }
        }
      } catch(e) {
        console.error("Error al cargar datos:", e);
      }

      updateUI();
    }

    async function toggleCreatineLog(dateKey, forceValue = null) {
      if (!currentUser) return;
      const shouldAdd = forceValue !== null ? forceValue : !userLogs.has(dateKey);

      if (shouldAdd) {
        userLogs.add(dateKey);
      } else {
        userLogs.delete(dateKey);
      }

      try {
        const docRef = doc(db, "creatine_users", currentUser.uid);
        await setDoc(docRef, { logs: Array.from(userLogs) }, { merge: true });
      } catch(e) {
        console.error("Error al guardar datos:", e);
      }

      updateUI();
    }

    toggleBtn.onclick = () => {
      const todayKey = formatDateKey(new Date());
      toggleCreatineLog(todayKey);
    };

    // UI Updates
    function updateUI() {
      const todayKey = formatDateKey(new Date());
      const hasTakenToday = userLogs.has(todayKey);

      // Main Status Card
      if (hasTakenToday) {
        statusCard.className = "status-card completed";
        statusCard.innerText = "¡Creatina de hoy registrada! 💊";
        toggleBtn.innerText = "Marcar como no tomada";
      } else {
        statusCard.className = "status-card pending";
        statusCard.innerText = "Pendiente por tomar hoy ⏳";
        toggleBtn.innerText = "Registrar Creatina Hoy";
      }

      calculateStats();
      renderCalendar();
    }

    function calculateStats() {
      if (userLogs.size === 0) {
        document.getElementById('stat-first-date').innerText = "--/--";
        document.getElementById('stat-taken').innerText = "0";
        document.getElementById('stat-missed').innerText = "0";
        document.getElementById('stat-streak').innerText = "0 🔥";
        return;
      }

      const sortedDates = Array.from(userLogs).sort();
      const firstDate = new Date(sortedDates[0]);
      const today = new Date();
      today.setHours(0,0,0,0);

      // First Date display
      document.getElementById('stat-first-date').innerText = firstDate.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });

      // Calculate Total Days elapsed
      const timeDiff = Math.max(0, today - firstDate);
      const totalDaysElapsed = Math.floor(timeDiff / (1000 * 60 * 60 * 24)) + 1;
      const takenCount = userLogs.size;
      const missedCount = Math.max(0, totalDaysElapsed - takenCount);

      document.getElementById('stat-taken').innerText = takenCount;
      document.getElementById('stat-missed').innerText = missedCount;

      // Calculate Streak
      let streak = 0;
      let checkDate = new Date();
      checkDate.setHours(0,0,0,0);

      while (true) {
        const key = formatDateKey(checkDate);
        if (userLogs.has(key)) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          if (formatDateKey(checkDate) === formatDateKey(new Date())) {
            checkDate.setDate(checkDate.getDate() - 1);
            continue;
          }
          break;
        }
      }

      document.getElementById('stat-streak').innerText = `${streak} 🔥`;
    }

    // Calendar Renderer
    function renderCalendar() {
      const daysContainer = document.getElementById('calendar-days');
      daysContainer.innerHTML = '';

      const year = currentDisplayDate.getFullYear();
      const month = currentDisplayDate.getMonth();

      document.getElementById('calendar-month-year').innerText = new Date(year, month).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }).toUpperCase();

      // Day Names Header
      const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
      dayNames.forEach(name => {
        const div = document.createElement('div');
        div.className = 'day-name';
        div.innerText = name;
        daysContainer.appendChild(div);
      });

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = new Date();
      today.setHours(0,0,0,0);

      // Empty slots before month start
      for (let i = 0; i < firstDayOfMonth; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        daysContainer.appendChild(emptyCell);
      }

      // Fill Month Days
      const sortedDates = Array.from(userLogs).sort();
      const firstEverDate = sortedDates.length > 0 ? new Date(sortedDates[0]) : null;
      if (firstEverDate) firstEverDate.setHours(0,0,0,0);

      for (let day = 1; day <= daysInMonth; day++) {
        const cellDate = new Date(year, month, day);
        cellDate.setHours(0,0,0,0);
        const dateKey = formatDateKey(cellDate);

        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.innerText = day;

        if (userLogs.has(dateKey)) {
          cell.classList.add('taken');
        } else if (firstEverDate && cellDate >= firstEverDate && cellDate <= today) {
          cell.classList.add('missed');
        }

        daysContainer.appendChild(cell);
      }
    }

    // Calendar Controls
    document.getElementById('prev-month').onclick = () => {
      currentDisplayDate.setMonth(currentDisplayDate.getMonth() - 1);
      renderCalendar();
    };

    document.getElementById('next-month').onclick = () => {
      currentDisplayDate.setMonth(currentDisplayDate.getMonth() + 1);
      renderCalendar();
    };
  </script>
</body>
</html>
